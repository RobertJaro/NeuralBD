base_dir: runs/standard_numpy
work_dir: runs/standard_numpy/work
method: standard

data:
  type: numpy
  path: examples/data/synthetic_burst.npy
  n_images: 4
  pixel_per_ds: 32.0

model:
  image:
    dim: 64
    n_layers: 3
  psf:
    target_size: 9
    sigma: 2.0

training:
  epochs: 10
  validation_every_n_epochs: 1
  checkpoint_every_n_epochs: 5
  progressive:
    sampling_points: 128

outputs:
  sample_count: 5
